server {
    listen 80;                   # le port écouté dans le conteneur
    server_name localhost;

    root /usr/share/nginx/html;  # le dossier où sont les fichiers servis
    index index.html;            # le fichier rendu pour l'adresse /

    location / {
        # le fichier demandé, sinon le dossier, sinon index.html
        try_files $uri $uri/ /index.html;
    }
}
