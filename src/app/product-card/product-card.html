<article class="product-card">
  <img [ngSrc]="product().thumbnail" [alt]="product().title" width="300" height="300" />
  <h3>{{ product().title }}</h3>
  <p>{{ product().price }} €</p>
  @if (product().stock === 0) {
    <p>Victime de son succès</p>
  } @else {
    <button (click)="cart.add(product())">Ajouter au panier</button>
  }
  <p>Dans ton panier : {{ cart.quantityOf(product()) }}</p>
</article>
