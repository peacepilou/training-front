@if (product(); as p) {
  <article class="product-detail">
    <img [src]="p.thumbnail" [alt]="p.title" />
    <div>
      <h2>{{ p.title }}</h2>
      <p>{{ p.price }} €</p>
      <p>Stock : {{ p.stock }}</p>
      <button (click)="cart.add(p)">Ajouter au panier</button>
      <p>Dans ton panier : {{ cart.quantityOf(p) }}</p>
    </div>
  </article>
  @if (p.reviews; as reviews) {
    @defer (on viewport) {
      <app-product-reviews [reviews]="reviews" />
    } @placeholder {
      <p>Les avis clients arrivent…</p>
    }
  }
} @else {
  <h2>Produit introuvable</h2>
}
