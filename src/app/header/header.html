<header class="header">
  <h1>Training Shop</h1>
  <p>Le catalogue d'entraînement</p>
  <p>🛒 {{ cart.count() }} article(s) · {{ cart.total().toFixed(2) }} €</p>
  <p>{{ shipping() }}</p>
  <button (click)="cart.clear()">Vider le panier</button>
  <nav>
    <a routerLink="/">Accueil</a>
    <a routerLink="/products/new">Ajouter un produit</a>
    <a routerLink="/account">Mon compte</a>
    @if (auth.isLoggedIn()) {
      <button (click)="onLogout()">Se déconnecter</button>
    }
  </nav>
</header>
