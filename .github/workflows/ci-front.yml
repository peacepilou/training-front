name: CI Front

on:
  push:
    branches-ignore:
      - main
      - development

  pull_request:
    branches:
      - main
      - development

jobs:
  lint:
    name: Front Lint
    runs-on: ubuntu-latest
    env:
      CYPRESS_INSTALL_BINARY: 0 # ce job n'a pas besoin du navigateur de Cypress

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  unit-tests:
    name: Front Unit Tests
    runs-on: ubuntu-latest
    env:
      CYPRESS_INSTALL_BINARY: 0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:ci

  build:
    name: Front Build
    runs-on: ubuntu-latest
    env:
      CYPRESS_INSTALL_BINARY: 0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the app
        run: npm run build

  e2e-tests:
    name: Front E2E Tests
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, build]
    if: github.event_name == 'pull_request' && github.base_ref == 'main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Run Cypress E2E tests
        uses: cypress-io/github-action@v7
        with:
          start: npm start
          wait-on: 'http://localhost:4200'
          command: npm run cypress:ci
